name: Presubmit Integration Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request number to test (leave empty to test the selected branch)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  integration-test:
    name: MCM Integration Test (GDC Staging)
    if: >
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '/test-integration'))
    runs-on: ubuntu-latest
    environment: gdc-staging
    timeout-minutes: 25
    concurrency:
      group: ${{ github.workflow }}-${{ inputs.pr_number || github.event.issue.number || github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
      checks: write
      issues: write
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Sets up Go and registers the built-in Go problem matcher to automatically
      # surface any `go test` failures as GitHub Actions annotations.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      # Verifies author/commenter authorization strictly against origin/main
      # (without exposing GDC secrets), stages trusted CI scripts and the
      # compiled token-helper binary in /tmp/ci-trusted, and checks out + merges
      # origin/main into the target PR when triggered via /test-integration or workflow_dispatch.
      - name: Verify CI Preconditions
        id: preconditions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          CHECK_NAME: MCM Integration Test (GDC Staging)
        run: |
          git fetch origin main
          mkdir -p /tmp/ci-bootstrap
          if git show origin/main:scripts/ci-common.sh 2>/dev/null | grep -q 'verify_pr_head_at_comment_time'; then
            git show origin/main:scripts/ci-common.sh > /tmp/ci-bootstrap/ci-common.sh
          else
            cp ./scripts/ci-common.sh /tmp/ci-bootstrap/ci-common.sh
          fi
          source /tmp/ci-bootstrap/ci-common.sh
          verify_and_prepare_ci

      - name: Log in to ghcr.io
        if: steps.preconditions.outputs.should_run == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Runs the staged ci-integration-test.sh script from /tmp/ci-trusted, which installs
      # the gdcloud CLI from GDC Staging, builds and pushes the PR container image to ghcr.io,
      # runs the MCM integration test suite, and cleans up the temporary ghcr.io image on exit.
      - name: Run MCM Integration Test
        if: steps.preconditions.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECK_NAME: MCM Integration Test (GDC Staging)
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}/machine-controller-manager-provider-gdch
          GDC_MCM_SERVICE_ACCOUNT_KEY: ${{ secrets.GDC_MCM_SERVICE_ACCOUNT_KEY }}
        run: bash "${CI_TRUSTED_DIR}/scripts/ci-integration-test.sh"
