name: Presubmit Integration Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request number to test (leave empty to test the selected branch)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  integration-test:
    name: MCM Integration Test (GDC Staging)
    runs-on: ubuntu-latest
    environment: gdc-staging
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Sets up Go and registers the built-in Go problem matcher to automatically
      # surface any `go test` failures as GitHub Actions annotations.
      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Log in to ghcr.io
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Runs ./scripts/ci-integration-test.sh, which verifies CI preconditions, installs the
      # gdcloud CLI from GDC Staging, builds and pushes the PR container image to ghcr.io,
      # runs the MCM integration test suite, and cleans up the temporary ghcr.io image on exit.
      - name: Run MCM Integration Test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          CHECK_NAME: MCM Integration Test (GDC Staging)
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}/machine-controller-manager-provider-gdch
          GDC_MCM_SERVICE_ACCOUNT_KEY: ${{ secrets.GDC_MCM_SERVICE_ACCOUNT_KEY }}
        run: make test-integration
